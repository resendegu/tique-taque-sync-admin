apiVersion: v1
kind: Secret
metadata:
  name: tique-taque-sync-admin-secrets
  namespace: tique-taque-sync-admin
  labels:
    app.kubernetes.io/name: tique-taque-sync-admin
type: Opaque
stringData:
  # Token da API Pública do TiqueTaque (obtido em Configurações > Integrações > API Pública)
  TIQUETAQUE_ADMIN_TOKEN: "seu-token-uuid-da-api-publica"

  # Configuração do Slack Bot ("TiqueTaque Ponto")
  SLACK_ENABLED: "true"
  SLACK_BOT_TOKEN: "xoxb-seu-slack-bot-token"
  SLACK_SIGNING_SECRET: "seu-slack-signing-secret"

  # Chave secreta interna
  ADMIN_SECRET_KEY: "gere-uma-chave-secreta-aleatoria-aqui"
