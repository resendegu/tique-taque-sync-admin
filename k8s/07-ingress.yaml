# ==============================================================================
# Dual Ingress Architecture:
# 1. UI & Admin Ingress (ponto-admin...): Deve ser protegido por Cloudflare Access,
#    VPN ou autenticação corporativa (SSO / Zero Trust). Serve a UI e /api/admin/*.
# 2. Webhook & Public API Ingress (ponto-api...): Aberto para a internet, expondo
#    APENAS os endpoints de webhook do Slack (/api/slack/*) e liveness (/healthz).
#    Os endpoints administrativos e os dados de funcionários NÃO são expostos aqui.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tique-taque-sync-admin-ui
  namespace: tique-taque-sync-admin
  labels:
    app.kubernetes.io/name: tique-taque-sync-admin
    app.kubernetes.io/component: ui
  annotations:
    kubernetes.io/ingress.class: nginx # ou traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - ponto-admin.suaempresa.com.br
      secretName: tique-taque-sync-admin-ui-tls
  rules:
    - host: ponto-admin.suaempresa.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tique-taque-sync-admin
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tique-taque-sync-admin-api
  namespace: tique-taque-sync-admin
  labels:
    app.kubernetes.io/name: tique-taque-sync-admin
    app.kubernetes.io/component: api
  annotations:
    kubernetes.io/ingress.class: nginx # ou traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - ponto-api.suaempresa.com.br
      secretName: tique-taque-sync-admin-api-tls
  rules:
    - host: ponto-api.suaempresa.com.br
      http:
        paths:
          - path: /api/slack
            pathType: Prefix
            backend:
              service:
                name: tique-taque-sync-admin
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: tique-taque-sync-admin
                port:
                  number: 8000
