name: Docker

# Publica a imagem multi-arquitetura no GitHub Packages (GHCR):
#   ghcr.io/resendegu/tique-taque-sync-admin
#
# Este é o artefato principal do projeto: o deploy alvo é Kubernetes ou uma VM
# com Docker, então a imagem é construída, TESTADA de verdade e só então
# publicada.
#
# Tags geradas:
#   latest          -> último commit da branch main
#   main            -> mesma coisa, por nome de branch
#   1.2.3 / 1.2 / 1 -> quando uma tag v1.2.3 é criada
#   sha-<commit>    -> rastreabilidade de cada build

on:
  push:
    branches: [main]
    # Aceita tanto `v1.2.3` quanto `1.2.3` — as duas convenções aparecem na
    # prática, e uma tag fora do filtro publicaria a versão sem querer.
    tags: ["v[0-9]*", "[0-9]*"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A versão do projeto mora em [project].version do pyproject.toml. Alterar
  # aquela linha é o que declara uma release: este job compara com o commit
  # anterior e o restante do workflow age a partir daí.
  version:
    name: Versão do pyproject
    runs-on: ubuntu-latest
    outputs:
      # `|| 'false'` cobre os casos em que o passo nem roda (PR, push de tag).
      changed: ${{ steps.detect.outputs.changed || 'false' }}
      version: ${{ steps.detect.outputs.version }}
      major_minor: ${{ steps.detect.outputs.major_minor }}
      major: ${{ steps.detect.outputs.major }}
      prerelease: ${{ steps.detect.outputs.prerelease || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # o commit atual e o anterior, para comparar a versão

      - name: Detectar alteração de versão
        id: detect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git show HEAD^:pyproject.toml > /tmp/previous.toml 2>/dev/null; then
            python scripts/version_bump.py --current pyproject.toml --previous /tmp/previous.toml
          else
            # Primeiro commit do repositório: não há com o que comparar.
            python scripts/version_bump.py --current pyproject.toml
          fi

  build:
    name: Build, teste e push (amd64 + arm64)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # Tag da IMAGEM, que não é a tag do git: a metadata-action remove o "v"
      # de `v1.2.3` e publica `1.2.3`.
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # QEMU é necessário para montar a camada arm64 (Raspberry Pi, Apple
      # Silicon, nós Ampere/Graviton) a partir de um runner amd64.
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # As três últimas linhas de `tags` vêm do pyproject.toml e só ficam ativas
      # quando a versão mudou neste commit. As tags móveis `1.2` e `1` ficam de
      # fora em pré-lançamentos, para não apontarem um `rc` como versão estável.
      #
      # Sem comentários dentro do bloco `tags:` de propósito: ali dentro o `#`
      # faz parte da string passada à action, não é comentário do YAML.
      - name: Calcular tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.changed == 'true' }}
            type=raw,value=${{ needs.version.outputs.major_minor }},enable=${{ needs.version.outputs.changed == 'true' && needs.version.outputs.prerelease != 'true' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ needs.version.outputs.changed == 'true' && needs.version.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=TiqueTaque Sync Admin
            org.opencontainers.image.description=Notificações corporativas de jornada via Slack, integradas à API Admin do TiqueTaque
            org.opencontainers.image.licenses=MIT

      # Build só de amd64, carregado no daemon local, para conseguir RODAR a
      # imagem antes de publicá-la. O build multi-arch abaixo reaproveita o cache.
      - name: Build de teste (amd64, carregado localmente)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tique-taque-sync-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testar a imagem
        run: |
          set -euo pipefail

          # Sem token real: o app deve subir mesmo assim e responder aos probes,
          # porque é isso que o Kubernetes vai exigir antes de marcar o pod Ready.
          docker run -d --name ttq-admin-ci \
            -p 8000:8000 \
            -e TIQUETAQUE_ADMIN_TOKEN=token-de-teste-do-ci \
            -e SLACK_ENABLED=false \
            -e ADMIN_SECRET_KEY=chave-de-teste-do-ci \
            tique-taque-sync-admin:ci

          echo "Aguardando o healthcheck do container..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ttq-admin-ci 2>/dev/null || echo unknown)
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$(docker inspect --format='{{.State.Running}}' ttq-admin-ci)" != "true" ]; then
              echo "::error::O container morreu durante a inicialização"
              docker logs ttq-admin-ci
              exit 1
            fi
            sleep 2
          done

          if [ "$status" != "healthy" ]; then
            echo "::error::HEALTHCHECK do container não ficou saudável (último estado: $status)"
            docker logs ttq-admin-ci
            exit 1
          fi

          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:8000/healthz | tee /tmp/healthz.json
          grep -q '"status":"ok"' /tmp/healthz.json

          echo "--- painel administrativo ---"
          curl -fsS http://127.0.0.1:8000/ | grep -q "TiqueTaque Sync Admin"

          echo "--- estáticos ---"
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/css/admin.css

          # /api/admin/* precisa continuar fechado: o painel é interno e o único
          # endpoint pensado para a internet é o webhook do Slack.
          echo "--- proteção dos endpoints administrativos ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/admin/metrics)
          if [ "$code" != "403" ]; then
            echo "::error::/api/admin/metrics respondeu $code, esperado 403 sem credencial"
            docker logs ttq-admin-ci
            exit 1
          fi

          echo "Imagem validada: sobe, fica healthy, serve o painel e protege a API admin."

      - name: Encerrar o container de teste
        if: always()
        run: docker rm -f ttq-admin-ci 2>/dev/null || true

      - name: Autenticar no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Permite que quem baixa a imagem verifique que ela saiu deste repositório:
      #   gh attestation verify oci://ghcr.io/resendegu/tique-taque-sync-admin:latest \
      #     --repo resendegu/tique-taque-sync-admin
      - name: Gerar atestado de proveniência
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Resumo do build
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Imagem publicada :whale:"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Caminho principal: a versão do pyproject.toml mudou neste push para a main.
  # A tag do git, a release e as notas são criadas AQUI, no mesmo run que acabou
  # de publicar a imagem — e não por workflows encadeados.
  #
  # Isso não é só elegância: uma tag empurrada com o GITHUB_TOKEN **não dispara**
  # outros workflows (o GitHub bloqueia para evitar recursão). Um `docker.yml`
  # que dependesse do evento de push da tag simplesmente nunca rodaria.
  release:
    name: Tag e release da versão
    needs: [version, build]
    if: >-
      needs.version.outputs.changed == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o --generate-notes

      - name: Criar a tag do git
        id: tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::notice::A tag ${tag} já existe — nada a criar."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release ${VERSION}"
            git push origin "$tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Criar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::A release ${TAG} já existe — as notas serão atualizadas."
            exit 0
          fi

          flags=(--title "$TAG" --generate-notes)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"

      - name: Escrever as instruções de deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PLATFORMS: "linux/amd64, linux/arm64"
        run: bash scripts/release-notes.sh

  # Caminho alternativo: alguém empurrou uma tag à mão, sem passar pelo bump do
  # pyproject.toml. A imagem já foi publicada pelo job `build`; aqui só as notas.
  release-notes:
    name: Notas da release (tag manual)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Escrever as instruções de deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PLATFORMS: "linux/amd64, linux/arm64"
        run: bash scripts/release-notes.sh
