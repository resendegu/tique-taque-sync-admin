name: Release

# Caminho normal: a tag é empurrada, o workflow Docker builda, publica a imagem
# e — no job `release-notes` dele — escreve as instruções de deploy na release.
#
# Este workflow cobre o outro caso: a release é publicada DEPOIS que a imagem já
# existe (ou é publicada na interface do GitHub, disparando o evento `release`).
# Em vez de ficar sondando o registry, ele espera o run do Docker daquele commit
# usando `gh run watch` e só então escreve as notas.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release cujas notas serão reescritas"
        required: true

permissions:
  contents: read

jobs:
  notes:
    name: Instruções de deploy na release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Se a tag acabou de ser criada, o workflow Docker está rodando agora. Em
      # vez de adivinhar quanto tempo ele leva, esperamos o run daquele commit.
      - name: Esperar o build da imagem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)

          run_id=$(gh run list \
            --workflow=docker.yml \
            --commit "$sha" \
            --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0].databaseId // empty')

          if [ -z "$run_id" ]; then
            echo "Nenhum run do Docker para ${sha:0:7} — a imagem já deve estar publicada."
            exit 0
          fi

          echo "Acompanhando o run ${run_id} do workflow Docker..."
          # --exit-status faz o passo falhar se o build falhou: não faz sentido
          # anunciar instruções de deploy de uma imagem que não subiu.
          gh run watch "$run_id" --exit-status --interval 15

      - name: Descobrir a tag e o digest da imagem
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # A metadata-action publica `1.2.3` para a tag `v1.2.3`: o "v" cai.
          image_tag="${TAG#v}"
          image="ghcr.io/${{ github.repository }}"

          # O pacote pode ser privado; autenticar antes de inspecionar.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          digest=""
          platforms=""
          if inspect=$(docker buildx imagetools inspect "${image}:${image_tag}" 2>/dev/null); then
            digest=$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')
            platforms=$(printf '%s\n' "$inspect" | awk '/Platform:/ {print $2}' | sort -u | paste -sd ',' - | sed 's/,/, /g')
            echo "Imagem encontrada: ${image}:${image_tag} (${digest})"
          else
            echo "::warning::Não foi possível inspecionar ${image}:${image_tag} — as notas sairão sem o digest."
          fi

          {
            echo "tag=${image_tag}"
            echo "digest=${digest}"
            echo "platforms=${platforms}"
          } >> "$GITHUB_OUTPUT"

      - name: Escrever as instruções de deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PLATFORMS: ${{ steps.image.outputs.platforms }}
        run: bash scripts/release-notes.sh
