name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar a suíte de testes
        run: python tests/run_tests.py

  manifests:
    name: Manifests de deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Não confiar no que vem pré-instalado no runner: o `kubectl kustomize`
      # é o que valida os manifests.
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      # O alvo deste projeto é cluster e VM: manifest quebrado só aparece no
      # `kubectl apply` de quem está subindo. Melhor falhar aqui.
      - name: Validar o kustomize
        run: |
          # O secret real não é versionado; o usuário copia do exemplo, e é
          # exatamente esse caminho que estamos validando.
          cp k8s/03-secret.example.yaml k8s/03-secret.yaml
          kubectl kustomize k8s/ > /tmp/rendered.yaml
          echo "Recursos gerados:"
          grep -E "^kind:" /tmp/rendered.yaml | sort | uniq -c

      - name: Conferir que o Deployment aponta para a imagem publicada
        run: |
          image=$(grep -E "^\s+image:" k8s/05-deployment.yaml | awk '{print $2}')
          echo "Imagem no Deployment: $image"
          case "$image" in
            ghcr.io/${{ github.repository }}:*) echo "OK" ;;
            *) echo "::error::O Deployment deveria apontar para ghcr.io/${{ github.repository }}"; exit 1 ;;
          esac

      - name: Validar o docker-compose
        run: |
          # O compose exige o .env (é o fluxo documentado no README); sem ele
          # `docker compose config` falha, então reproduzimos o passo do usuário.
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml OK"

      - name: Conferir que nenhum segredo real vazou nos exemplos
        run: |
          # Os arquivos .example são copiados por quem usa o projeto: um valor
          # real aqui viraria credencial pública.
          if grep -rEn "xoxb-[0-9]{5,}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" \
               .env.example k8s/03-secret.example.yaml src/config.py; then
            echo "::error::Valor com cara de credencial real encontrado — use um placeholder"
            exit 1
          fi
          echo "Nenhum segredo aparente nos arquivos de exemplo"
